# Builds the site and copies it to Hostinger over SSH.
# Runs on every push to main (new content), twice a day (so each page shows the new day's times),
# and by hand from the Actions tab ("Run workflow").
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'   # 00:15 UTC: new day for Europe, Africa, the Middle East and Asia
    - cron: '15 6 * * *'   # 06:15 UTC: new day for the Americas
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Hostinger SSH details (hPanel > Advanced > SSH Access). Not secret; the private key is.
  SSH_HOST: 145.79.31.12
  SSH_PORT: '65002'
  SSH_USER: u320645487

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node build.js

      - name: Check (links, hreflang, sitemap, titles)
        run: node --max-old-space-size=8192 scripts/check.js

      - name: Deploy to Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_SALAAHDAILY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's public host keys (ssh-keyscan, 2026-09-30): refuse to connect to anything else.
          cat > ~/.ssh/known_hosts <<'EOF'
          [145.79.31.12]:65002 ssh-rsa 
          [145.79.31.12]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBANlp6jvxckanGKdGruPFf15aZkstbuGRLp35mN5Pne51l6MK5wayO76VvuVfMeZsHEV3Du1F5zh4wXdVfTSyXU=
          [145.79.31.12]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBV4VmAbo49lntkQd9tInPKGZhsVu4jVdfxxL07gWN/2
          EOF
          sed -i 's/^ *//' ~/.ssh/known_hosts
          # Only changed files are sent. Pages removed from the build are removed from the server;
          # .well-known/ (SSL checks) is never touched.
          rsync -rlz --checksum --delete-after --filter='P .well-known/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:domains/salaahdaily.com/public_html/"
          rm -f ~/.ssh/deploy_key

      - name: Tell search engines (IndexNow, new content only)
        if: github.event_name == 'push'
        run: node scripts/indexnow.js
